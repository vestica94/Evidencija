<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Evidencija</title>
  <meta name="description" content="Evidencija viđanja djeteta i bilježenje događaja s dokazima spremnim za sud.">
  <meta name="theme-color" content="#1f3a8a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Evidencija">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <div>
          <div class="brand-name">Evidencija</div>
          <div class="brand-case" id="caseName"></div>
        </div>
      </div>
      <button class="icon-btn" data-action="settings" aria-label="Postavke" title="Postavke">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <button class="fab" data-action="fab" aria-label="Dodaj">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </button>
    <div class="fab-menu" id="fabMenu" hidden>
      <button data-action="new-event-with-doc"><span>Događaj s dokumentom</span><i>📎</i></button>
      <button data-action="new-event"><span>Novi događaj</span><i>📅</i></button>
      <button data-action="new-visit"><span>Zabilježi viđanje</span><i>👧</i></button>
      <button data-action="new-doc"><span>Dodaj dokaz</span><i>📄</i></button>
    </div>

    <nav class="tabs" aria-label="Glavni izbornik">
      <button data-tab="timeline" class="active">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M5 4h2v16H5zm4 1h10v4H9zm0 6h7v4H9zm0 6h10v2H9z"/></svg>
        Vremenska crta
      </button>
      <button data-tab="docs">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6 2h8l6 6v14H6zm7 1.5V9h5.5zM8 13h8v1.5H8zm0 3h8v1.5H8z"/></svg>
        Dokazi
      </button>
      <button data-tab="visits">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm-1 7v11h12V9zm2 2h3v3H8z"/></svg>
        Viđanja
      </button>
    </nav>
  </div>

  <input type="file" id="filePicker" accept="image/*,application/pdf,.pdf,.doc,.docx,.txt,audio/*,video/*" multiple hidden>
  <input type="file" id="backupPicker" accept="application/json,.json" hidden>

  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="printArea"></div>

  <noscript>Za rad aplikacije potreban je JavaScript.</noscript>
  <script src="js/db.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/stamp.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
